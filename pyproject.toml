[project]
name = "autoembed"
version = "0.1.0"
description = "Agentic embedding-model training benchmark, scored on MTEB"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=5.0",
    "mteb>=1.12",
    "torch>=2.2,<2.10",
    "datasets>=2.19",
    "accelerate>=0.30",
]

[tool.uv]
# torch pinned to a CUDA 12.8 wheel index. Change the URL to match your driver,
# or drop the [tool.uv.sources]/[[tool.uv.index]] blocks for the default wheel.

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
